; eter reference node: ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM)

[env:esp32s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.8.1

; N16R8 memory layout (the stock board definition is the N8 variant)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial goes to the native USB port (the one labelled "USB", not "UART")
    -DARDUINO_USB_CDC_ON_BOOT=1
