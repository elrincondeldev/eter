[project]
name = "eter"
version = "0.0.0"
description = "Bridge between radio nodes and AI agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "pyserial>=3.5",
    "typer>=0.29.1",
]

[project.scripts]
eter = "eter_cli.main:app"
eter-mcp = "eter_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyserial>=3.5.0.20261104",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eter_core", "eter_mcp", "eter_cli", "eter_api", "eter_sim"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
